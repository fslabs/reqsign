[package]
name = "reqsign-core"
version = "3.3.1"

categories = ["command-line-utilities", "web-programming"]
description = "Signing API requests without effort."

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
jwt = ["dep:rsa", "dep:serde", "dep:serde_json"]
# Compute the `hash` module's digests and HMACs with AWS-LC instead of RustCrypto.
aws-lc-rs = ["dep:aws-lc-rs", "aws-lc-rs?/aws-lc-sys"]
# As `aws-lc-rs`, using the AWS-LC FIPS module.
# `?/` keeps this from also enabling the `aws-lc-rs` feature and its non-FIPS build.
aws-lc-rs-fips = ["dep:aws-lc-rs", "aws-lc-rs?/fips"]

[dependencies]
anyhow = { workspace = true }
aws-lc-rs = { workspace = true, optional = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
mea = { workspace = true }
percent-encoding = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# Optional dependencies
rsa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.0", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Com",
] }
